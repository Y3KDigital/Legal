name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint YAML (basic)
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
          yamllint -d "{extends: default, rules: {line-length: disable}}" compliance docs agents || true

      - name: Lint Markdown (basic)
        run: |
          npm --version || true
          echo "Markdown lint can be added later (remark/markdownlint)."

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: |
          echo "Add Foundry/Hardhat test pipeline once contract stack is chosen."
